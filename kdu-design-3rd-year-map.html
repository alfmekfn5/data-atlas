<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --ink: #111113;
      --muted: #5b5e66;
      --line: #e2e2de;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 72px; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end;
      gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 24px; margin-bottom: 32px;
    }
    h1 { margin: 8px 0 0; font-size: clamp(24px, 3vw, 38px); letter-spacing: -0.02em; }
    .kicker { font-size: 13px; color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; align-items: center; }
    .btn {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
    }
    .btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    input[type="search"] {
      padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); font-size: 13px; min-width: 220px;
    }
    .map-shell {
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-bottom: 40px;
    }
    @media (max-width: 900px) { .map-shell { grid-template-columns: 1fr; } }
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
    }
    svg { width: 100%; height: auto; display: block; background: #fbfbfa; border-radius: 10px; border: 1px solid var(--line); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #b8bcc4; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    .name { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
    .row { font-size: 13px; margin: 4px 0; color: #2d2f36; }
    .links { display: flex; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; }
    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .note { margin-top: 8px; font-size: 12px; color: #b45309; background: #fef3c7; padding: 6px 10px; border-radius: 6px; }
  </style>
</head>

    function project(lat, lng) {
      if (scope === 'metro') {
        const minLng = 126.86, maxLng = 127.86, minLat = 37.42, maxLat = 37.96;
        const x = 50 + ((lng - minLng) / (maxLng - minLng)) * 720;
        const y = 470 - ((lat - minLat) / (maxLat - minLat)) * 420;
        return { x, y };
      } else {
        const minLng = 125.6, maxLng = 129.6, minLat = 34.2, maxLat = 38.6;
        const x = 90 + ((lng - minLng) / (maxLng - minLng)) * 640;
        const y = 480 - ((lat - minLat) / (maxLat - minLat)) * 430;
        return { x, y };
      }
    }

    function renderInspector() {
      const s = DATA.students.find(x => x.id === selectedId) || DATA.students[0];
      const el = document.getElementById('inspector');
      el.innerHTML = `
        <div class="meta">${String(s.index).padStart(2,'0')} · ${s.cityLabel} · ${s.genderRaw}</div>
        <h2 style="margin:0 0 12px;font-size:26px;">${s.name}</h2>
        <div class="row"><strong>주소:</strong> ${s.addressRaw}</div>
        <div class="row"><strong>취미:</strong> ${s.hobbiesRaw}</div>
        <div class="row"><strong>세상에서 가장 아끼는 것:</strong> ${s.treasureRaw}</div>
        ${s.extraNote ? `<div class="note">${s.extraNote}</div>` : ''}
        <div class="links">
          <a href="${s.githubUrl}" target="_blank" rel="noreferrer">GitHub</a>
          ${s.pagesUrl ? `<a href="${s.pagesUrl}" target="_blank" rel="noreferrer">GitHub Pages</a>` : '<span style="color:#888">Pages 미제출</span>'}

        </div>
      `;
    }

    function renderMap() {
      const svg = document.getElementById('map');
      const items = DATA.students.filter(s => scope === 'national' || s.regionGroup !== 'gyeongnam');
      let out = '';
      if (scope === 'national') {
        out += '<path d="M270,55 L470,48 L565,120 L635,280 L615,390 L485,435 L335,455 L265,375 L255,210 Z" fill="#f1f1ed" stroke="#d4d4ce" stroke-width="1.5"/>';
      } else {
        out += '<path d="M55,345 Q240,320 410,360 T760,340" fill="none" stroke="#dbeafe" stroke-width="14" stroke-linecap="round"/>';
        out += '<text x="150" y="348" font-size="11" fill="#60a5fa">한강 수계</text>';
      }
      DATA.students.forEach(s => {
        s.mentionsPeerIds.forEach(pid => {
          const t = DATA.students.find(x => x.id === pid);
          if (!t) return;
          if (scope === 'metro' && (s.regionGroup === 'gyeongnam' || t.regionGroup === 'gyeongnam')) return;
          const p1 = project(s.lat, s.lng), p2 = project(t.lat, t.lng);
          out += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#2563eb" stroke-dasharray="4 4" stroke-width="1.5" opacity="0.65"/>`;
        });
      });
      items.forEach(s => {
        const p = project(s.lat, s.lng);
        const ox = scope === 'metro' && s.metroOffset ? s.metroOffset.dx : 0;
        const oy = scope === 'metro' && s.metroOffset ? s.metroOffset.dy : 0;
        const cx = p.x + ox, cy = p.y + oy;
        const active = s.id === selectedId;
        const color = DATA.regionColors[s.regionGroup] || '#111';
        out += `<g style="cursor:pointer" onclick="selectStudent('${s.id}')">
          <circle cx="${cx}" cy="${cy}" r="${active ? 10 : 7}" fill="${color}" stroke="#fff" stroke-width="2.5"/>
          <text x="${cx}" y="${cy - 12}" text-anchor="middle" font-size="11.5" font-weight="${active ? '700' : '500'}" fill="#111113">${s.name}</text>
        </g>`;
      });
      svg.innerHTML = out;
    }

      document.getElementById('grid').innerHTML = filtered.map(s => `
        <article class="card" onclick="selectStudent('${s.id}')" style="cursor:pointer">
          <div class="meta">${String(s.index).padStart(2,'0')} · ${s.cityLabel} · ${s.genderRaw}</div>
          <h3 class="name">${s.name}</h3>
          <div class="row">취미: ${s.hobbiesRaw}</div>
          <div class="row">아끼는 것: ${s.treasureRaw}</div>
          ${s.extraNote ? `<div class="note">${s.extraNote}</div>` : ''}
          <div class="links">
            <a href="${s.githubUrl}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">GitHub</a>
            ${s.pagesUrl ? `<a href="${s.pagesUrl}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">Pages</a>` : '<span style="color:#888">Pages 없음</span>'}
            <a href="${s.instagramUrl}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">${s.instagramHandle}</a>
          </div>
        </article>
      `).join('');
    }

    window.selectStudent = function(id) {
      selectedId = id;
      renderMap();
      renderInspector();
    };

    document.querySelectorAll('[data-scope]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-scope]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        scope = btn.dataset.scope;
        renderMap();
      });
    });

    document.getElementById('search').addEventListener('input', (e) => {
      query = e.target.value;
      renderGrid();
    });

    renderMap();
    renderInspector();
    renderGrid();
  </script>
</body>
</html>
