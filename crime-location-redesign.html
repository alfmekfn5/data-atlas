const ic=i=>`<svg viewBox="0 0 48 48">${IC[i]}</svg>`;
const pinS='<svg viewBox="0 0 48 48"><path class="c" d="M24 1C14 1 8 8 8 16c0 11 16 30 16 30s16-19 16-30C40 8 34 1 24 1z"/><circle class="y" cx="24" cy="16" r="7"/><circle class="d" cx="24" cy="16" r="3"/></svg>';
const sum=a=>a.reduce((x,y)=>x+y,0);
const tot=P.map((p,i)=>sum(rows.map(r=>r[2+i]))),T=sum(tot);
const gTot=GN.map(g=>sum(P.map((p,i)=>place2g[p]==g?tot[i]:0)));
const majors=[...new Set(rows.map(r=>r[0]))];
const mTot={},mG={};
majors.forEach(m=>{const rs=rows.filter(r=>r[0]==m);mTot[m]=sum(rs.map(r=>sum(r.slice(2))));mG[m]=GN.map(g=>sum(rs.map(r=>sum(P.map((p,i)=>place2g[p]==g?r[2+i]:0)))))});
const lab=s=>s.replace(/_/g,'·');
const topP=P.map((p,i)=>[p,tot[i]]).sort((a,b)=>b[1]-a[1]);
const gi=GN.map((g,i)=>i).sort((a,b)=>gTot[b]-gTot[a]);
const tm=majors.slice().sort((a,b)=>mTot[b]-mTot[a])[0];
document.getElementById('kpis').innerHTML=[
['총 범죄 발생 건수',fmt(T)+'건'],
['가장 많이 발생한 장소',lab(topP[0][0])+' · '+(topP[0][1]/T*100).toFixed(1)+'%'],
['가장 큰 장소 유형',GN[gi[0]]+' · '+(gTot[gi[0]]/T*100).toFixed(1)+'%'],
['최다 범죄 대분류',tm+' · '+(mTot[tm]/T*100).toFixed(1)+'%']
].map(([a,b])=>`<div class="kpi">${pinS}<div><small>${a}</small><b>${b}</b></div></div>`).join('');
const mx=topP[0][1];
document.getElementById('rows').innerHTML=topP.slice(0,15).map(([p,v])=>`<div class="row">${ic(GN.indexOf(place2g[p]))}<span title="${lab(p)}">${lab(p)}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><b>${fmt(v)}</b></div>`).join('');
document.getElementById('gc').innerHTML=gi.map(i=>`<div class="g">${ic(i)}<em>${GN[i]}</em><b>${fmt(gTot[i])}</b><u>${(gTot[i]/T*100).toFixed(1)}%</u></div>`).join('');
const pal=['#f0617a','#fbe9a0','#7b74e8','#ff9aa9','#4fd1c5','#f6b04b','#a78bfa','#e05297','#38bdf8','#ffd166','#9ae6b4'];
Chart.defaults.color='#cdbfe8';Chart.defaults.borderColor='rgba(255,255,255,.08)';Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
new Chart('c2',{type:'doughnut',data:{labels:GN,datasets:[{data:gTot,backgroundColor:pal,borderColor:'#2a2152',borderWidth:3}]},options:{cutout:'58%',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.label+': '+fmt(c.raw)+'건 ('+(c.raw/T*100).toFixed(1)+'%)'}}}}});
const sel=document.getElementById('sel');
sel.innerHTML='<option value="-1">전체 범죄</option>'+rows.map((r,i)=>`<option value="${i}">${r[0]} › ${r[1]}</option>`).join('');
let c3;
function draw3(){const k=+sel.value,arr=k<0?tot:rows[k].slice(2);const t=P.map((p,i)=>[p,arr[i]]).sort((a,b)=>b[1]-a[1]).slice(0,10);const s=sum(arr);
 if(c3)c3.destroy();
 c3=new Chart('c3',{type:'bar',data:{labels:t.map(x=>lab(x[0])),datasets:[{data:t.map(x=>x[1]),backgroundColor:t.map((x,i)=>i<3?'#fbe9a0':'#f0617a'),borderRadius:99,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw)+'건 ('+(s?(c.raw/s*100).toFixed(1):0)+'%)'}}},scales:{x:{ticks:{callback:v=>fmt(v)}},y:{grid:{display:false}}}}})}
sel.onchange=draw3;draw3();
new Chart('c4',{type:'bar',data:{labels:majors,datasets:GN.map((g,i)=>({label:g,backgroundColor:pal[i],borderColor:'#2a2152',borderWidth:1,data:majors.map(m=>mTot[m]?mG[m][i]/mTot[m]*100:0)}))},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true,max:100,ticks:{callback:v=>v+'%'}},y:{stacked:true,grid:{display:false}}},plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.raw.toFixed(1)+'%'}}}}});
const hm=Math.max(...majors.flatMap(m=>mG[m]));
document.getElementById('tb').innerHTML='<tr><th>범죄 대분류</th>'+GN.map((g,i)=>`<th><svg viewBox="0 0 48 48" width="44" height="44" style="display:block;margin:0 auto 4px">${IC[i]}</svg>${g}</th>`).join('')+'<th>합계</th></tr>'+majors.map(m=>`<tr><td>${m}</td>`+mG[m].map(v=>{const a=Math.sqrt(v/hm);return `<td style="background:rgba(240,97,122,${(.08+a*.92).toFixed(2)});color:${a>.5?'#2a1030':'#fbe9a0'}">${fmt(v)}</td>`}).join('')+`<td><b>${fmt(mTot[m])}</b></td></tr>`).join('');
</script></body></html>
