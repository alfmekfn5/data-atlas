        out += '<path d="M270,55 L470,48 L565,120 L635,280 L615,390 L485,435 L335,455 L265,375 L255,210 Z" fill="#f1ecfa" stroke="#c4b5fd" stroke-width="1.5"/>';
      } else {
        out += '<path d="M55,345 Q240,320 410,360 T760,340" fill="none" stroke="#dbeafe" stroke-width="14" stroke-linecap="round"/>';
        out += '<text x="150" y="348" font-size="11" fill="#2563eb" font-weight="600">한강 수계</text>';
      }
      DATA.students.forEach(s => {
        s.mentionsPeerIds.forEach(pid => {
          const t = DATA.students.find(x => x.id === pid);
          if (!t) return;
          if (scope === 'metro' && (s.regionGroup === 'gyeongnam' || t.regionGroup === 'gyeongnam')) return;
          const p1 = project(s.lat, s.lng), p2 = project(t.lat, t.lng);
          out += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#ec4899" stroke-dasharray="4 4" stroke-width="1.8" opacity="0.8"/>`;
        });
      });
      items.forEach(s => {
        const p = project(s.lat, s.lng);
        const ox = scope === 'metro' && s.metroOffset ? s.metroOffset.dx : 0;
        const oy = scope === 'metro' && s.metroOffset ? s.metroOffset.dy : 0;
        const cx = p.x + ox, cy = p.y + oy;
        const active = s.id === selectedId;
        const color = DATA.regionColors[s.regionGroup] || '#7c3aed';
        out += `<g style="cursor:pointer" onclick="selectStudent('${s.id}')">
          ${active ? `<circle cx="${cx}" cy="${cy}" r="15" fill="${color}" fill-opacity="0.18" stroke="#ec4899" stroke-width="1.2"/>` : ''}
          <circle cx="${cx}" cy="${cy}" r="${active ? 10 : 7}" fill="${color}" stroke="#fff" stroke-width="2.5"/>
          <text x="${cx}" y="${cy - 13}" text-anchor="middle" font-size="12" font-weight="${active ? '700' : '600'}" fill="#161229">${s.name}</text>
        </g>`;
      });
      svg.innerHTML = out;
    }

    function renderTableAndGrid() {
      const q = query.trim().toLowerCase();
      const filtered = DATA.students.filter(s => {
        if (!q) return true;
        return [s.name, s.addressRaw, s.hobbiesRaw, s.treasureRaw, s.genderRaw].join(' ').toLowerCase().includes(q);
      });

      document.getElementById('table-body').innerHTML = filtered.map(s => `
        <tr class="${s.id === selectedId ? 'active' : ''}" style="cursor:pointer" onclick="selectStudent('${s.id}')">
          <td class="mono">${String(s.index).padStart(2,'0')}</td>
          <td><strong class="font-display">${s.name}</strong><br><span style="font-size:11px;color:#5e577a">${s.instagramHandle}</span></td>
          <td>${s.cityLabel}</td>
          <td>${s.hobbiesRaw}</td>
          <td class="font-display">${s.treasureRaw}</td>
          <td>${s.genderRaw}</td>
          <td onclick="event.stopPropagation()">
            <a href="${s.githubUrl}" target="_blank" rel="noreferrer">GitHub</a> ·
            ${s.pagesUrl ? `<a href="${s.pagesUrl}" target="_blank" rel="noreferrer">Pages</a>` : '<span style="color:#94a3b8">미제출</span>'}
          </td>
        </tr>
      `).join('');

      document.getElementById('grid').innerHTML = filtered.map(s => {
        const color = DATA.regionColors[s.regionGroup] || '#7c3aed';
        return `
        <article class="card" onclick="selectStudent('${s.id}')" style="cursor:pointer">
          <div style="height:4px;background:${color}"></div>
          <div class="card-body">
            <div class="meta mono">${String(s.index).padStart(2,'0')} · ${s.cityLabel} · ${s.genderRaw}</div>
            <h3 class="name">${s.name}</h3>
            <div class="row">취미: ${s.hobbiesRaw}</div>
            <div class="row">아끼는 것: <strong class="font-display">${s.treasureRaw}</strong></div>
            ${s.extraNote ? `<div class="note">${s.extraNote}</div>` : ''}
          </div>
          <div class="links">
            <a href="${s.githubUrl}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">GitHub</a>
            ${s.pagesUrl ? `<a href="${s.pagesUrl}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">Pages</a>` : '<span style="color:#94a3b8">Pages 없음</span>'}
            <a href="${s.instagramUrl}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">${s.instagramHandle}</a>
          </div>
        </article>`;
      }).join('');
    }

    window.selectStudent = function(id) {
      selectedId = id;
      renderMap();
      renderInspector();
      renderTableAndGrid();
    };

    document.querySelectorAll('[data-scope]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-scope]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        scope = btn.dataset.scope;
        renderMap();
      });
    });

    document.getElementById('search').addEventListener('input', (e) => {
      query = e.target.value;
      renderTableAndGrid();
    });

    renderMap();
    renderInspector();
    renderTableAndGrid();
  </script>
</body>
</html>
